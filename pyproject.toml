[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "six-hats"
version = "0.1.2"
description = "Multi-agent parallel reasoning engine based on Edward de Bono's Six Thinking Hats for code review, architecture, and debugging."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Six Hats Contributors" }
]
keywords = [
    "six-hats",
    "mcp",
    "mcp-server",
    "claude-code",
    "cursor",
    "antigravity",
    "multi-agent",
    "code-review",
    "software-architecture",
    "tree-sitter",
    "de-bono",
    "llm",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Bug Tracking",
]

dependencies = [
    "mcp>=1.0.0",
    "click>=8.1.0",
    "rich>=13.7.0",
    "pydantic>=2.6.0",
    "tree-sitter>=0.24.0",
    "tree-sitter-python>=0.25.0",
    "tree-sitter-javascript>=0.25.0",
    "tree-sitter-typescript>=0.23.2",
    "tree-sitter-go>=0.25.0",
    "tree-sitter-rust>=0.24.2",
]

[project.urls]
Homepage = "https://github.com/elpabloultron/six-hats"
Documentation = "https://github.com/elpabloultron/six-hats#readme"
Repository = "https://github.com/elpabloultron/six-hats"
Issues = "https://github.com/elpabloultron/six-hats/issues"
Changelog = "https://github.com/elpabloultron/six-hats/releases"

[project.optional-dependencies]
genai = [
    "google-genai>=2.0.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
six-hats = "six_hats.cli:cli"
hats = "six_hats.cli:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/six_hats"]
